# CI: the checks a pull request must pass before review (docs/workflow.md: "CI must pass").
# Five jobs. The prototypes' smoke tests: the mobile one plays 800 games against the bot through the pure engine,
# replays each from its seed, renders every screen for every event, and walks the guided game; the packs one checks
# the online resolver's rules and plays 480 simulated games. They need only node. The server job formats, compiles
# with warnings as errors, and tests the Elixir app against a real Postgres, since every game is an event log there.
# The web job checks the client's formatting, runs its tests and builds it. The exit job is the Phase 1 exit as a
# test: a real server, and a whole game against the bot played through the client's own modules, then replayed.
# The image job builds the Dockerfile the way a host would, runs it against Postgres (it migrates itself), and plays
# the exit test against the production release: the client and the API from one origin.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    # This name is the status check branch protection requires on main: rename both together.
    name: mobile prototype smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node prototypes/mobile/smoke-test.js
      - run: node prototypes/packs/smoke-test.js

  server:
    name: server format, compile, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@v6
        with:
          path: |
            server/deps
            server/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('server/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  web:
    name: web format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  exit:
    name: phase 1 exit, played and replayed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # the dev server: the test env's sandboxed database takes no requests from outside a test
      MIX_ENV: dev
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@v6
        with:
          path: |
            server/deps
            server/_build
          key: mix-dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('server/mix.lock') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the remote
        working-directory: server
        run: |
          mix deps.get
          mix ecto.create
          mix ecto.migrate
          mix phx.server > ../phx.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:4000/api/health && exit 0; sleep 1; done
          cat ../phx.log
          exit 1
      - name: Play a game against the bot, and replay it
        working-directory: web
        env:
          GITGAME_REMOTE: http://localhost:4000
        run: |
          npm ci
          npx vitest run src/exit.test.js

  image:
    name: release image, built and played
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitgame
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t gitgame .
      - name: Start it, as a host would
        run: |
          docker run -d --name gitgame --network host \
            -e DATABASE_URL=ecto://postgres:postgres@localhost/gitgame \
            -e SECRET_KEY_BASE="$(openssl rand -base64 48)" \
            -e PHX_HOST=localhost -e PORT=4000 \
            gitgame
          for i in $(seq 1 60); do curl -sf localhost:4000/api/health && exit 0; sleep 1; done
          docker logs gitgame
          exit 1
      - name: The page comes from the same origin, with its policy
        run: |
          curl -sf -D headers.txt localhost:4000/ | grep -q "<title>"
          grep -qi "content-security-policy" headers.txt
          curl -sf localhost:4000/play | grep -q 'id="app"'
          test "$(curl -s -o /dev/null -w '%{redirect_url}' 'localhost:4000/?via=notification')" = "http://localhost:4000/play?via=notification"
          curl -sf localhost:4000/manifest.webmanifest > /dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Play a game against the bot on the release, and replay it
        working-directory: web
        env:
          GITGAME_REMOTE: http://localhost:4000
        run: |
          npm ci
          npx vitest run src/exit.test.js
      - name: The beta report, read inside the release (M13a)
        run: |
          docker exec gitgame /app/bin/beta_report --since "$(date -u +%F)"
          docker exec gitgame /app/bin/beta_report --json | jq -e '.games.started >= 1'
      - name: The release's log, if anything failed
        if: failure()
        run: docker logs gitgame
