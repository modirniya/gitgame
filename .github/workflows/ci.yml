# CI: the checks a pull request must pass before review (docs/workflow.md: "CI must pass").
# Four jobs. The prototypes' smoke tests: the mobile one plays 800 games against the bot through the pure engine,
# replays each from its seed, renders every screen for every event, and walks the guided game; the packs one checks
# the online resolver's rules and plays 480 simulated games. They need only node. The server job formats, compiles
# with warnings as errors, and tests the Elixir app against a real Postgres, since every game is an event log there.
# The web job checks the client's formatting, runs its tests and builds it. The exit job is the Phase 1 exit as a
# test: a real server, and a whole game against the bot played through the client's own modules, then replayed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    # This name is the status check branch protection requires on main: rename both together.
    name: mobile prototype smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node prototypes/mobile/smoke-test.js
      - run: node prototypes/packs/smoke-test.js

  server:
    name: server format, compile, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@v6
        with:
          path: |
            server/deps
            server/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('server/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  web:
    name: web format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  exit:
    name: phase 1 exit, played and replayed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # the dev server: the test env's sandboxed database takes no requests from outside a test
      MIX_ENV: dev
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@v6
        with:
          path: |
            server/deps
            server/_build
          key: mix-dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('server/mix.lock') }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the remote
        working-directory: server
        run: |
          mix deps.get
          mix ecto.create
          mix ecto.migrate
          mix phx.server > ../phx.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:4000/api/health && exit 0; sleep 1; done
          cat ../phx.log
          exit 1
      - name: Play a game against the bot, and replay it
        working-directory: web
        env:
          GITGAME_REMOTE: http://localhost:4000
        run: |
          npm ci
          npx vitest run src/exit.test.js
