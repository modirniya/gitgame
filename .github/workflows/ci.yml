# CI: the checks a pull request must pass before review (docs/workflow.md: "CI must pass").
# Today those are the prototypes' smoke tests. The mobile one plays 800 games against the bot through the pure
# engine, replays each from its seed, renders every screen for every event, and walks the guided game; the packs one
# checks the online resolver's rules and plays 480 simulated games. No dependencies to install: the prototypes are
# plain ES modules and the tests need only node.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    # This name is the status check branch protection requires on main: rename both together.
    name: mobile prototype smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node prototypes/mobile/smoke-test.js
      - run: node prototypes/packs/smoke-test.js
