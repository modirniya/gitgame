<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEE9DF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15191D" media="(prefers-color-scheme: dark)">
  <title>Git Game · mobile prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The frame: a status bar, the screen the router renders into, the Table sheet and the guide layer. -->
  <div id="app">
    <header id="status" class="status" hidden></header>
    <main id="screen"></main>
  </div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="guide" class="guide" hidden></div>
  <script type="module">
    import { start } from './router.js';
    start(document.getElementById('screen'));
  </script>
</body>
</html>
