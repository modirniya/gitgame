<!doctype html>
<!-- The landing page's link-preview image (ADR-0009), drawn at 1200×630 by scripts/og-image.sh into web/public/og.png.
     The game's colors (web/src/styles.css) and the deck's file colors (rules/deck.json); the name is drawn in, so a
     rename (docs/branding.md) runs the script again. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #14181c;
        color: #e7ecef;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-variant-ligatures: none;
        padding: 64px 72px;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto 1fr auto;
        column-gap: 48px;
      }
      h1 {
        grid-column: 1 / -1;
        margin: 0;
        font-size: 76px;
      }
      h1 span {
        color: #3ec1b3;
      }
      .lede {
        grid-column: 1 / -1;
        margin: 14px 0 0;
        font-size: 30px;
        color: #8a8f99;
      }
      .term {
        align-self: end;
        background: #0d0f12;
        border-radius: 12px;
        padding: 22px 26px;
        font-size: 22px;
        line-height: 1.55;
        white-space: pre;
        color: #d8d5ce;
      }
      .who {
        color: #ff6ac1;
      }
      .bot {
        color: #9aa3b5;
      }
      .ok {
        color: #52c98f;
      }
      .no {
        color: #ff6f5b;
      }
      .cards {
        align-self: end;
        display: flex;
        gap: 14px;
      }
      /* the game's card (web/src/cards.css) at 124 px wide */
      .card {
        position: relative;
        width: 124px;
        height: 174px;
        border-radius: 11px;
        border: 1px solid #343e47;
        background: #252c33;
        display: grid;
        grid-template-rows: 25px 1fr;
        overflow: hidden;
        text-align: center;
      }
      .band {
        background: var(--band);
        color: #fff;
        font:
          700 11px/25px system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-align: left;
        padding: 0 12px;
      }
      .face {
        display: grid;
        align-content: center;
        gap: 6px;
      }
      .file {
        font-size: 16px;
        font-weight: 600;
      }
      .big {
        font:
          700 42px/1 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .bug {
        position: absolute;
        left: 6px;
        top: 32px;
        padding: 0 7px;
        border-radius: 6px;
        background: #ff6f5b;
        color: #fff;
        font:
          800 12px/22px system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0.06em;
      }
      .domain {
        grid-column: 1 / -1;
        align-self: end;
        margin-top: 26px;
        font-size: 26px;
        color: #3ec1b3;
      }
    </style>
  </head>
  <body>
    <h1><span>$</span> Git Game</h1>
    <p class="lede">a multiplayer card game whose rules are Git</p>
    <div class="term">
      <span class="who">ana@main</span> $ git push
      <span class="ok"> 3f2c1d9..8e1da02 main -&gt; main</span>
      <span class="bot">bot@main</span> $ git push
      <span class="no"> ! [rejected] main -&gt; main (non-fast-forward)</span>
    </div>
    <div class="cards">
      <div class="card" style="--band: #3ec1b3">
        <span class="band">commit</span
        ><span class="face"
          ><span class="file">auth.js</span><span class="big">+5</span></span
        >
      </div>
      <div class="card" style="--band: #a88bfa">
        <span class="band">commit</span
        ><span class="face"
          ><span class="file">api.py</span><span class="big">+6</span></span
        ><span class="bug">BUG</span>
      </div>
    </div>
    <p class="domain">gitgame.online · play free in your browser</p>
  </body>
</html>
